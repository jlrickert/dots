version: 2

before:
  hooks:
    - go mod tidy
    - go run ./cmd/dots/internal/gendocs

builds:
  - id: dots
    binary: dots
    main: ./cmd/dots
    env: [CGO_ENABLED=0, GOWORK=off]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -X github.com/jlrickert/dots/pkg/cli.Version={{.Version}}"]

archives:
  - id: dots
    ids: [dots]
    name_template: "dots_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md, CHANGELOG.md]

nfpms:
  - id: dots
    ids: [dots]
    package_name: dots
    vendor: Jared Rickert
    homepage: https://github.com/jlrickert/dots
    maintainer: Jared Rickert <jaredrickert52@gmail.com>
    description: |-
      A brew-style dotfile package manager with taps, profiles,
      overlays, and cross-platform support.
    license: Apache-2.0
    formats: [deb, rpm]
    bindir: /usr/bin
    dependencies:
      - git
    contents:
      - src: ./LICENSE
        dst: /usr/share/doc/dots/LICENSE
      - src: ./README.md
        dst: /usr/share/doc/dots/README.md
      - src: ./CHANGELOG.md
        dst: /usr/share/doc/dots/CHANGELOG.md
      - src: ./dist/completions/dots.bash
        dst: /usr/share/bash-completion/completions/dots
      - src: ./dist/completions/dots.zsh
        dst: /usr/share/zsh/vendor-completions/_dots
      - src: ./dist/completions/dots.fish
        dst: /usr/share/fish/vendor_completions.d/dots.fish
      - src: ./dist/man/*.1
        dst: /usr/share/man/man1/
        file_info:
          mode: 0644

brews:
  - ids: [dots]
    name: dots
    repository:
      owner: jlrickert
      name: homebrew-formulae
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/jlrickert/dots"
    description: "A brew-style dotfile package manager with taps, profiles, overlays, and cross-platform support"
    license: "Apache-2.0"
    install: |
      bin.install "dots"
      generate_completions_from_executable(bin/"dots", "completion")
    test: |
      system "#{bin}/dots", "--version"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^chore: release v"
      - "^Merge"

release:
  extra_files:
    - glob: ./scripts/install.sh
  footer: |
    ---
    Released with [GoReleaser](https://goreleaser.com).
