# yaml-language-server: $schema=https://raw.githubusercontent.com/jlrickert/dots/main/schemas/dotfile.json
#
# Bootstrap package for the profiles fixture. It links dots' own config plus
# the profile definitions, mirroring the dots package pattern documented in
# docs/bootstrapping.md. Profile files are linked individually because
# directory links are not supported yet.
package:
  name: dots-config
  description: Bootstrap package for the profiles fixture tap
  version: 0.1.0
  tags:
    - dots
    - meta
links:
  config.yaml: '@config/dots/config.yaml'
  profiles/base.yaml: '@config/dots/profiles/base.yaml'
  profiles/work.yaml: '@config/dots/profiles/work.yaml'
  profiles/personal.yaml: '@config/dots/profiles/personal.yaml'
